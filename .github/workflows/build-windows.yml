name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Create JavaFX runtime image (jlink)
        run: mvn -B javafx:jlink --file pom.xml

      - name: Prepare jpackage input
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target\jpackage-input
          Copy-Item target\lor-1.0.0.jar target\jpackage-input\

      - name: Build app-image with jpackage
        shell: pwsh
        run: |
          jpackage --type app-image `
            --name "Lor" `
            --input target\jpackage-input `
            --main-jar lor-1.0.0.jar `
            --main-class com.okunev.lor.Main `
            --runtime-image target\app `
            --dest target\dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lor-windows
          path: target/dist/
          if-no-files-found: error

      - name: Build Installer Bundles with jDeploy
        uses: shannah/jdeploy@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_repository: andrey-okunev/Lor-releases