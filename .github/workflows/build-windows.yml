name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven + jlink
        run: mvn -B clean package javafx:jlink --file pom.xml

      - name: Show jlink output (debug)
        shell: pwsh
        run: |
          Write-Host "=== target\app ==="
          if (Test-Path target\app) { Get-ChildItem -Recurse target\app | Select-Object FullName }
          Write-Host "=== target\app\mods ==="
          if (Test-Path target\app\mods) { Get-ChildItem target\app\mods }

      - name: Build app-image with jpackage
        shell: pwsh
        run: |
          jpackage --type app-image `
            --name "Lor" `
            --module-path "target\app\mods" `
            --module "com.okunev.lor/com.okunev.lor.Main" `
            --runtime-image "target\app" `
            --dest "target\dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lor-windows
          path: target/dist/
          if-no-files-found: error