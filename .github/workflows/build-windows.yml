name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build + jlink runtime image
        run: mvn -B clean package javafx:jlink --file pom.xml

      - name: Zip jlink image
        shell: pwsh
        run: |
          Compress-Archive -Path target\app\* -DestinationPath target\Lor-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lor-windows
          path: target/Lor-windows.zip
          if-no-files-found: error