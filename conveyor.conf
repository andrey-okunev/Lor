// ============================================================================
// Conveyor configuration for Lor Medical Protocols
// ============================================================================

// 1. JDK 17 (OpenJDK)
include required("/stdlib/jdk/17/openjdk.conf")

// 2. JavaFX — Conveyor сам получит JAR-ы из Maven
include required("/stdlib/jvm/javafx/from-maven.conf")

// 3. Клиентские улучшения JVM (proxy detection и т.п.)
//include required("/stdlib/jvm/enhancements/client/v1.conf")

// ============================================================================
// Настройки приложения
// ============================================================================
app {
  // --- Идентификация (обязательные поля) ---
  display-name = "Lor Medical Protocols"
  fsname = lor
  version = "1.0.62"
  vendor = "Okunev"
  rdns-name = "com.okunev.lor"
  description = "Медицинские протоколы"

  // --- Лицензия (бесплатно для open-source) ---
  // Убедитесь, что репозиторий публичный
  vcs-url = "https://github.com/andrey-okunev/Lor"

  // --- Обновления ---
  // URL, откуда клиенты будут получать обновления
  updates = aggressive

  // --- Главный класс приложения ---
  jvm.gui.main-class = com.okunev.lor.Main

  // --- Входные файлы ---
  // ЯВНО указываем ваш JAR как первый вход.
  // from-maven.conf добавит остальные JAR-ы (Jackson, JavaFX) ПОСЛЕ этого.
  inputs = [target/lor-1.0.0.jar]

  // --- Иконки (опционально, раскомментируйте при наличии) ---
  // icons = "src/main/resources/icons/icon-rounded-*.png"
  // windows.icons = "src/main/resources/icons/icon-square-*.png"
  // mac.icons = "src/main/resources/icons/icon-rounded-*.png"
}
conveyor.compatibility-level = 23
